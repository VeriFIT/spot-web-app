stages:
  - build

compile:
  stage: build
  except:
    - /wip/
  image: gitlab-registry.lrde.epita.fr/spot/buildenv/debian-node
  script:
    - cd client
    - npm install
    - npm run build
  artifacts:
    when: always
    expire_in: 6 months
    paths:
      - ./client/build/
      - ./server/*.py

