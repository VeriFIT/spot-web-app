stages:
  - check
  - build

default:
  image: gitlab-registry.lre.epita.fr/spot/buildenv/debian-node
  cache:
    key:
      files:
        - client/package-lock.json
    paths:
      - client/node_modules/

lint:
  stage: check
  except:
    - /wip/
  script:
    - cd client
    - npm ci
    - npm run lint
    - npm run format:check

compile:
  stage: build
  except:
    - /wip/
  script:
    - cd client
    - npm ci
    - npm run build
  artifacts:
    when: always
    expire_in: 6 months
    paths:
      - ./client/build/
      - ./server/*.py
